<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;font-weight:700;src:url(assets/fredoka-700.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
#stage>*,#sc>*{position:absolute;left:0;top:0}
.full{width:1080px;height:1920px}
.col{left:0;width:1080px;display:flex;flex-direction:column;align-items:center}
#title{top:185px}#label{top:1225px}
.ln{font-family:Fredoka;font-weight:700;filter:url(#f-clay);white-space:nowrap}
#title .ln{color:#ffe08a;text-shadow:0 6px 0 #b8892b,0 16px 18px rgba(0,0,0,.4);line-height:1.1}
#name{color:#ff7d5c;text-shadow:0 8px 0 #a83f25,0 20px 22px rgba(0,0,0,.4);line-height:1.02}
#num{color:#fff6e3;text-shadow:0 6px 0 #a99a7c,0 16px 18px rgba(0,0,0,.4);line-height:1.15}
#tp{font-size:46px;color:#fff6e3;text-shadow:0 4px 0 #8c8168,0 10px 12px rgba(0,0,0,.45)}
.clay{filter:url(#f-clay) drop-shadow(6px 12px 8px rgba(8,8,40,.5))}
.star{border-radius:50%;background:#fff3c9;filter:url(#f-clay) drop-shadow(3px 6px 4px rgba(8,8,40,.5))}
#dot{width:14px;height:14px;border-radius:50%;background:#ffb11f;filter:drop-shadow(0 0 8px #ffb11f)}
#arw{width:90px;height:130px}
.bar{height:52px;border-radius:26px}
.stk{width:240px;border-radius:16px;background:repeating-linear-gradient(180deg,#f2b93b 0 15px,#b47d1c 15px 20px)}
.stk i{position:absolute;left:0;top:-18px;width:240px;height:40px;border-radius:50%;background:#ffe9a0}
.bub{border-radius:50%;background:rgba(255,255,255,.28);box-shadow:inset -3px -3px 0 rgba(255,255,255,.35)}
.tick{width:46px;height:10px;border-radius:5px;background:rgba(255,255,255,.45)}
#pr{border-radius:50%;background:#ff3b3b;filter:url(#f-clay) drop-shadow(0 0 16px #ff3b3b)}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
 <filter id="f-clay" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
  <feTurbulence id="tc1" type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="1" result="w"/>
  <feDisplacementMap in="SourceGraphic" in2="w" scale="12" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feTurbulence id="tc2" type="fractalNoise" baseFrequency=".07" numOctaves="3" seed="5" result="b"/>
  <feDiffuseLighting in="b" surfaceScale="3" diffuseConstant="1.22" lighting-color="#fff" result="l"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting>
  <feBlend in="d" in2="l" mode="multiply" result="m"/>
  <feComposite in="m" in2="d" operator="in" result="mm"/>
  <feGaussianBlur in="d" stdDeviation="7" result="bl"/>
  <feSpecularLighting in="bl" surfaceScale="6" specularConstant=".7" specularExponent="16" lighting-color="#fff" result="sp"><feDistantLight azimuth="225" elevation="48"/></feSpecularLighting>
  <feComposite in="sp" in2="d" operator="in" result="sp2"/>
  <feComposite in="mm" in2="sp2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/>
 </filter>
</svg>
<div id="stage"></div>
<script>
// ================= outils =================
const FPS=12;
const cl=x=>Math.max(0,Math.min(1,x)),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eo=x=>1-Math.pow(1-x,3);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('');};
const rnd=(a,b)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x);};
const jit=(bi,id,amp)=>(rnd(bi+1,id)-.5)*2*amp;
const fr=n=>n.toLocaleString('fr-FR').replace(/\s/g,' ');
const lerp=(a,b,k)=>a+(b-a)*k,llog=(a,b,k)=>Math.exp(lerp(Math.log(a),Math.log(b),k));
const fit=(el,txt,max,w)=>{el.textContent=txt;el.style.fontSize=Math.min(max,960/(Math.max(1,txt.length)*w))+'px';};
function bruit(){const c=document.createElement('canvas');c.width=540;c.height=960;const x=c.getContext('2d'),im=x.createImageData(540,960);let s=7;
 for(let i=0;i<im.data.length;i+=4){s=(s*1664525+1013904223)>>>0;const v=178+((s>>>16)&63);im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}x.putImageData(im,0,0);return c.toDataURL('image/png');}
// ================= boules (planètes, étoiles, galaxies…) =================
const band=(y,h,k=5)=>`M-2 ${y}q52 ${k} 104 0v${h}q-52 ${k} -104 0z`;
const LOOKS={
 lune:{c:{b:'#b9bcc4',f1:'#8f939c',f2:'#dcdee3',w:'#ffffff'},f:[['c',35,36,10,'f1'],['c',63,57,13,'f1'],['c',44,76,6,'f1'],['c',70,27,6,'f1'],['c',21,58,5,'f1'],['c',52,20,4,'f2']]},
 mars:{c:{b:'#dd6238',f1:'#a8421f',f2:'#f39062',w:'#fff3e6'},f:[['e',50,5,24,8,'w'],['e',40,50,20,10,'f1'],['e',68,68,13,7,'f1'],['c',28,72,5,'f2'],['c',70,36,6,'f2']]},
 terre:{c:{b:'#2f80da',f1:'#4fb56c',f2:'#2f9f5e',w:'#ffffff'},f:[['p','M20 30q10-13 25-6q8 5 3 14q-5 7-12 8q-3 10-10 4q-10-9-6-20z','f1'],['p','M52 52q10-6 18 2q6 10-2 21q-8 9-14-3q-6-10-2-20z','f1'],['p','M58 20q13-7 23 4q4 9-7 10q-12 2-16-14z','f2'],['e',50,3,22,6,'w'],['e',50,98,26,6,'w'],['e',30,62,10,3,'w']]},
 neptune:{c:{b:'#3a5ee0',f1:'#2743ad',f2:'#7693f5',w:'#dfe8ff'},f:[['p',band(26,9),'f2'],['p',band(52,7),'f1'],['p',band(72,10),'f1'],['e',38,44,10,5,'f1'],['e',62,38,8,2,'w']]},
 jupiter:{c:{b:'#e3bd8e',f1:'#b9774a',f2:'#f3e0c3',w:'#c8553a'},f:[['p',band(10,9),'f1'],['p',band(27,7),'f2'],['p',band(40,11),'f1'],['p',band(58,6),'f2'],['p',band(70,10),'f1'],['p',band(86,6),'f2'],['e',66,63,11,6,'w']]},
};
function spirale(a0){let d='';for(let k=0;k<=30;k++){const th=a0+k*.21,r=5+k*1.45;d+=(k?'L':'M')+(50+r*Math.cos(th)).toFixed(1)+' '+(50+r*Math.sin(th)).toFixed(1);}return d;}
function look(o,i){
 const col=o.couleur||'#ffb11f',L=o.look;
 if(LOOKS[L])return LOOKS[L];
 if(L=='systeme')return {c:{b:'#141a3a'},glow:'#6f7bd0',f:[['r',44,'#6f7bd0',1.4],['r',33,'#6f7bd0',1.4],['r',23,'#6f7bd0',1.4],['r',13,'#6f7bd0',1.4],['c',50,50,6,'#ffc23d'],['c',94,50,3,'#7693f5'],['c',50,17,3.5,'#e3bd8e'],['c',30,62,2.5,'#2f80da'],['c',59,41,2,'#dd6238']]};
 if(L=='trounoir')return {c:{b:'#06060c'},glow:'#ff9a2e',sh:0,f:[['r',41,'#ff8a1e',10],['r',33,'#ffd27a',3],['c',50,50,27,'#000000']]};
 if(L=='galaxie')return {c:{b:'#161b46'},glow:col,f:[['s',spirale(0),mix(col,'#ffffff',.2),9],['s',spirale(Math.PI),mix(col,'#ffffff',.2),9],['s',spirale(1.2),col,3],['s',spirale(1.2+Math.PI),col,3],['c',50,50,9,'#fff3c9']]};
 if(L=='amas'||L=='univers'){const f=[];
  if(L=='univers')for(let k=0;k<16;k++)f.push(['s',`M${(rnd(k,31)*100).toFixed(0)} ${(rnd(k,32)*100).toFixed(0)}Q${(rnd(k,33)*100).toFixed(0)} ${(rnd(k,34)*100).toFixed(0)} ${(rnd(k,35)*100).toFixed(0)} ${(rnd(k,36)*100).toFixed(0)}`,mix(col,'#000000',.2),1.6]);
  for(let k=0;k<(L=='univers'?46:26);k++)f.push(['c',6+rnd(i*17+k,41)*88,6+rnd(i*17+k,42)*88,(L=='univers'?1:1.8)+rnd(k,43)*(L=='univers'?1.8:3.4),k%3?mix(col,'#ffffff',.5):'#fff3c9']);
  return {c:{b:L=='univers'?'#0c0a24':'#131842'},glow:col,f};}
 const c={b:col,f1:mix(col,'#7a1500',.28),f2:mix(col,'#ffffff',.45)},f=[];
 for(let k=0;k<11;k++)f.push(['c',8+rnd(i*13+k,1)*84,8+rnd(i*13+k,2)*84,4+rnd(i*13+k,3)*8,k%3?'f2':'f1']);
 return {c,f,glow:col,sh:.28};
}
const shp=(f,a)=>f[0]=='c'?`<circle cx="${f[1]}" cy="${f[2]}" r="${f[3]}" ${a}/>`:f[0]=='e'?`<ellipse cx="${f[1]}" cy="${f[2]}" rx="${f[3]}" ry="${f[4]}" ${a}/>`:`<path d="${f[1]}" ${a}/>`;
function svgObj(o,i){
 const L=look(o,i),c=L.c;
 let s=`<svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible;display:block"><defs><clipPath id="cl${i}"><circle cx="50" cy="50" r="50"/></clipPath><radialGradient id="hl${i}" cx="33%" cy="27%" r="78%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${L.sh??.4}"/></radialGradient></defs><circle cx="50" cy="50" r="50" fill="${c.b}"/><g clip-path="url(#cl${i})">`;
 for(const f of L.f){
  if(f[0]=='r'){s+=`<circle cx="50" cy="50" r="${f[1]}" fill="none" stroke="${f[2]}" stroke-width="${f[3]}"/>`;continue;}
  if(f[0]=='s'){s+=`<path d="${f[1]}" fill="none" stroke="${f[2]}" stroke-width="${f[3]}" stroke-linecap="round"/>`;continue;}
  const col=f.at(-1),fill=col[0]=='#'?col:c[col];
  s+=shp(f,`fill="#000" opacity=".3" transform="translate(.9,1.3)"`)+shp(f,`fill="#fff" opacity=".35" transform="translate(-.7,-.9)"`)+shp(f,`fill="${fill}"`);}
 return s+`</g><circle cx="50" cy="50" r="50" fill="url(#hl${i})"/></svg>`;
}
const filtreBoule=(o,i)=>{const g=look(o,i).glow;return `url(#f-clay) ${g?`drop-shadow(0 0 34px ${g}99) `:''}drop-shadow(10px 22px 14px rgba(8,8,40,.55))`;};
// ================= figurines (océan) =================
const FIG={
 bateau:()=>`<path d="M20 62h160l-24 40H44z" fill="#b5552f"/><rect x="68" y="34" width="64" height="28" rx="5" fill="#fff3e0"/><rect x="92" y="10" width="18" height="26" rx="4" fill="#e0453a"/><circle cx="84" cy="48" r="5" fill="#2f80da"/><circle cx="116" cy="48" r="5" fill="#2f80da"/>`,
 plongeur:c=>`<g transform="rotate(-14 100 60)"><path d="M52 60l-40-18 4 40z" fill="${mix(c,'#000000',.3)}"/><rect x="46" y="44" width="96" height="34" rx="17" fill="${c}"/><rect x="62" y="28" width="62" height="18" rx="9" fill="#ffd23d"/><circle cx="152" cy="58" r="17" fill="#f2c29b"/><rect x="150" y="48" width="22" height="15" rx="5" fill="#7fd4ff"/></g>`,
 manchot:()=>`<ellipse cx="100" cy="62" rx="36" ry="52" fill="#20232e"/><ellipse cx="100" cy="72" rx="23" ry="37" fill="#ffffff"/><path d="M100 30l22 8-22 7z" fill="#ffa62b"/><circle cx="92" cy="28" r="4" fill="#fff"/><ellipse cx="84" cy="113" rx="12" ry="5" fill="#ffa62b"/><ellipse cx="116" cy="113" rx="12" ry="5" fill="#ffa62b"/><ellipse cx="62" cy="66" rx="8" ry="26" fill="#20232e" transform="rotate(18 62 66)"/><ellipse cx="138" cy="66" rx="8" ry="26" fill="#20232e" transform="rotate(-18 138 66)"/>`,
 meduse:()=>`<path d="M52 108q10-22 0-44M76 114q10-24 0-50M100 116q10-26 0-52M124 114q10-24 0-50M148 108q10-22 0-44" fill="none" stroke="#ffc4ea" stroke-width="6" stroke-linecap="round"/><path d="M44 64a56 52 0 0 1 112 0q-56 14-112 0z" fill="#ff7fc8"/><circle cx="82" cy="40" r="8" fill="#ffd0ee"/><circle cx="112" cy="30" r="5" fill="#ffd0ee"/>`,
 baleine:()=>`<path d="M162 58l34-26-6 28 8 24z" fill="#4a6c92"/><ellipse cx="92" cy="60" rx="84" ry="36" fill="#5b7fa6"/><ellipse cx="84" cy="78" rx="62" ry="15" fill="#cddbe9"/><ellipse cx="104" cy="94" rx="20" ry="8" fill="#4a6c92"/><circle cx="34" cy="52" r="5" fill="#10151c"/>`,
 epave:()=>`<g transform="rotate(-9 100 60)"><path d="M8 70h184l-20 36H30z" fill="#5a4636"/><rect x="46" y="52" width="108" height="18" rx="3" fill="#7d6753"/>${[0,1,2,3].map(k=>`<rect x="${56+k*24}" y="24" width="14" height="30" rx="2" fill="#c89a48"/><rect x="${56+k*24}" y="24" width="14" height="8" rx="2" fill="#1c1a18"/>`).join('')}</g>`,
 poisson:()=>`<path d="M148 60l40-28v56z" fill="#f48fb5"/><ellipse cx="92" cy="60" rx="66" ry="28" fill="#f7a8c4"/><circle cx="52" cy="52" r="9" fill="#fff"/><circle cx="50" cy="52" r="4" fill="#10151c"/><ellipse cx="100" cy="36" rx="22" ry="7" fill="#f48fb5"/>`,
 bathyscaphe:()=>`<rect x="52" y="96" width="14" height="22" rx="4" fill="#8a8f99"/><rect x="134" y="96" width="14" height="22" rx="4" fill="#8a8f99"/><rect x="146" y="48" width="34" height="22" rx="6" fill="#8a8f99"/><circle cx="100" cy="60" r="48" fill="#ffd23d"/><circle cx="92" cy="58" r="23" fill="#2b2f3a"/><circle cx="92" cy="58" r="16" fill="#7fd4ff"/><circle cx="86" cy="52" r="5" fill="#e8f8ff"/>`,
};
// ================= cadre commun =================
let D,O,N,T,FT,DUR,EV,TV,SONS,E,SC;
const SCENES={};
function evObj(i,t0,aff){const o=O[i];
 EV.push(o.texte?{t:t0,i,nom:o.nom,texte:o.texte}:{t:t0,i,nom:o.nom,c:aff});
 if(o.note){const tn=(i?T[i]:0)+(o.noteA||1.9);EV.push({t:tn,i,nom:o.nom,texte:o.note});SONS.push({t:tn,s:'toc',f:700,g:.3},{t:tn+.02,s:'note',k:N+1,g:.18,d:.7});}
 if(o.titre)TV.push({t:t0,l:o.titre});}
function init(data){
 D=data;O=data.objets;N=O.length;SC=SCENES[D.scene||'tailles'];
 T=[0];let t=0;for(let i=1;i<N;i++){t+=O[i].dt;T[i]=t;}
 FT=[];for(const f of D.fin||[]){t+=f.dt;FT.push(t);}
 DUR=Math.ceil((t+(D.queue||2.6))*FPS)/FPS;EV=[];TV=[];SONS=[];
 SC.init();
 (D.fin||[]).forEach((f,j)=>{const tf=FT[j]+.3;EV.push({t:tf,i:N-1,nom:f.nom,texte:f.texte,fin:1,point:f.point});if(f.titre)TV.push({t:tf,l:f.titre});
  SONS.push({t:tf,s:'toc',f:600,g:.3});if(f.point)SONS.push({t:tf,s:'whoosh',d:.3,fc:1500,g:.3},{t:tf+.3,s:'pip',g:.3});if(j==D.fin.length-1)SONS.push({t:tf,s:'accord',g:.2});});
 EV.sort((a,b)=>a.t-b.t);TV.sort((a,b)=>a.t-b.t);
 const stage=document.getElementById('stage');
 stage.innerHTML=`<div id="bgc" class="full"></div><div class="full" style="background:url(${bruit()});background-size:1080px 1920px;mix-blend-mode:multiply"></div><div class="full" style="background:radial-gradient(ellipse at 40% 35%,rgba(255,255,255,.1),rgba(0,0,20,.45) 95%)"></div><div id="sc" class="full"></div>
 <div id="dot" style="display:none"></div><div id="arw" class="clay" style="display:none"><svg viewBox="0 0 90 130" width="90" height="130"><path d="M30 6h30v66h24L45 124 6 72h24z" fill="#ffe08a"/></svg></div>
 <div id="tp" class="ln"></div><div id="title" class="col"><div class="ln"></div><div class="ln"></div></div><div id="label" class="col"><div class="ln" id="name"></div><div class="ln" id="num"></div></div>`;
 const g=id=>document.getElementById(id);
 E={bg:g('bgc'),sc:g('sc'),dot:g('dot'),arw:g('arw'),tp:g('tp'),title:g('title'),label:g('label'),name:g('name'),num:g('num'),tl:[...g('title').children]};
 SC.build(E.sc);draw(0);
 return {dur:DUR,sons:SONS,couv:T[N-1]+2.5,n:N};
}
function tag(txt,x,y,bi,minL=16){if(!txt){E.tp.style.display='none';return;}E.tp.style.display='block';E.tp.textContent=txt;const w=E.tp.offsetWidth;
 E.tp.style.transform=`translate(${Math.max(minL,Math.min(1064-w,x-w/2))+jit(bi,80,1)}px,${y+jit(bi,81,1)}px)`;}
function fleche(on,x,y,u,bi,dot){   // flèche qui tombe et pointe (x,y)
 if(!on){E.arw.style.display=E.dot.style.display='none';return;}
 const q=cl(u/.3),bob=u>.3?10*Math.sin((u-.3)*7):0;E.arw.style.display='block';
 E.arw.style.transform=`translate(${x-45+jit(bi,90,1.2)}px,${y-150-(1-q*q)*1300+bob}px) rotate(${jit(bi,91,.8)}deg)`;
 E.dot.style.display=dot?'block':'none';E.dot.style.transform=`translate(${x-7}px,${y-7}px)`;}
function draw(tRaw){
 const bi=Math.floor(tRaw*FPS+1e-6),t=bi/FPS;
 tc1.setAttribute('seed',1+bi%5);tc2.setAttribute('seed',5+bi%40);
 const F=D.fond,fq=(SC.frac?SC.frac(t):cl(t/(T[N-1]||1)))*(F.length-1),fi=Math.min(F.length-2,Math.floor(fq));
 E.bg.style.background=mix(F[fi],F[fi+1],fq-fi);
 let ev=EV[0];for(const e of EV)if(t>=e.t)ev=e;
 let tv=TV[0];for(const e of TV)if(t>=e.t)tv=e;
 let txt=ev.texte;
 if(!txt){const c=ev.c,q=eo(cl((t-c.cs)/(c.dur||.55))),de=c.de||0,v=de+(c.n-de)*q;txt=(c.pre||'')+(c.dec?v.toFixed(c.dec).replace('.',','):fr(Math.round(v)))+(c.suf||'');}
 fit(E.name,ev.nom,168,.68);fit(E.num,txt,98,.58);
 E.label.style.transform=`scale(${1+(ev.t>0?.14*Math.exp(-(t-ev.t)*9):0)})`;
 if(tv){const tm=Math.max(tv.l[0].length,tv.l[1].length);
  E.tl.forEach((ln,j)=>fit(ln,tv.l[j],92,.66*tm/Math.max(1,tv.l[j].length)));
  E.title.style.transform=`scale(${1+(tv.t>0?.12*Math.exp(-(t-tv.t)*9):0)})`;}
 [...E.tl,E.name,E.num].forEach((ln,j)=>ln.style.transform=`translate(${jit(bi,50+j,1)}px,${jit(bi,60+j,1)}px) rotate(${jit(bi,70+j,.3)}deg)`);
 SC.draw(t,bi,ev);
 stage.style.filter=`brightness(${1+jit(bi,200,.018)})`;
}
// ================= scène 1 : tailles (boules de plus en plus grosses) =================
SCENES.tailles={
 init(){
  O.forEach(o=>{if(o.x)o.d=o.x*D.soleil;});
  const X=this.X=[0];for(let i=1;i<N;i++)X[i]=X[i-1]+O[i-1].d/2+O[i].d/2+.18*O[i].d;
  const K=this.K=[{cx:0,s:440/O[0].d}];
  for(let k=1;k<N;k++){const L=X[k-1]-O[k-1].d/2,R=X[k]+O[k].d/2;K[k]={cx:(L+R)/2,s:860/(R-L)};}
  O.forEach((o,i)=>{const big=(i-1)/Math.max(1,N-2);
   evObj(i,i?T[i]+.35:0,{cs:i?T[i]+.42:.2,...(o.aff||(o.x?{n:o.x,de:1,suf:' × LE SOLEIL',dec:o.x<10?1:0}:{n:o.d,suf:' km'}))});
   if(i)SONS.push({t:T[i]-.08,s:'whoosh',d:.5,fc:1100-600*big,g:.5+.3*big},{t:T[i]+.35,s:'plop',big,g:.6+.25*big});
   SONS.push({t:i?T[i]+.42:.2,s:'compteur',n:10,f:1000,pas:.055,g:.16},{t:i?T[i]+.97:.75,s:'note',k:i,g:.26});});
 },
 build(L){let h='';for(let k=0;k<18;k++){const r=5+rnd(k,3)*14;h+=`<div class="star" style="width:${r}px;height:${r}px"></div>`;}
  for(let i=0;i<N;i++)h+=`<div id="pl${i}" style="display:none;filter:${filtreBoule(O[i],i)}">${svgObj(O[i],i)}</div>`;
  L.innerHTML=h;this.pl=O.map((_,i)=>document.getElementById('pl'+i));this.st=[...L.querySelectorAll('.star')];},
 draw(t,bi,ev){
  const {X,K}=this,CY=820;let k=0;for(let i=1;i<N;i++)if(t>=T[i])k=i;
  let cx=K[k].cx,s=K[k].s;
  if(k>0){const u=eio(cl((t-T[k])/.55)),a=K[k-1],b=K[k];s=llog(a.s,b.s,u);cx=lerp(a.cx*a.s,b.cx*b.s,u)/s;}
  let shake=0;if(k>0){const v=t-(T[k]+.35);if(v>=0)shake=Math.min(26,8+k*1.6)*Math.exp(-v*9)*Math.cos(v*40);}
  const pos=[];
  for(let i=0;i<N;i++){
   const el=this.pl[i],u=i?t-T[i]:99;
   if(u<0||i<k-3){el.style.display='none';continue;}
   const size=O[i].d*s,x=540+(X[i]-cx)*s,y=CY+shake;pos[i]={x,y,size};
   if(x+size<-200){el.style.display='none';continue;}
   let dy=0,sx=1,sy=1;
   if(u<.35){const q=u/.35;dy=-(1-q*q)*1600;}else{const v=u-.35,q=.24*Math.exp(-v*9)*Math.cos(v*24);sy=1-q;sx=1+q*.8;}
   sx*=1+jit(bi,i*7+4,.012);sy*=1+jit(bi,i*7+5,.012);
   el.style.display='block';el.style.width=el.style.height=size+'px';el.style.transformOrigin='50% 100%';
   el.style.transform=`translate(${x-size/2+jit(bi,i*7+1,1.4)}px,${y-size/2+dy+jit(bi,i*7+2,1.4)}px) rotate(${jit(bi,i*7+3,.5)}deg) scale(${sx},${sy})`;
  }
  const p=pos[ev.i-1];
  const pc=pos[ev.i];tag(p&&!ev.fin?O[ev.i-1].nom:'',p?p.x:0,p?(p.size<110&&pc?CY+Math.min(pc.size/2,340)+14:p.y+p.size/2+18):0,bi);
  fleche(ev.fin&&ev.point,210,1113,t-ev.t,bi,1);
  this.st.forEach((e,j)=>e.style.transform=`translate(${40+rnd(j,1)*1000+jit(bi,100+j,.9)}px,${430+rnd(j,2)*760+shake*.3+jit(bi,130+j,.9)}px)`);
 }
};
// ================= scène 2 : barres (course horizontale « h » ou piles de pièces « v ») =================
SCENES.barres={
 init(){
  const v=this.v=D.sens=='v';this.LEN=v?620:800;
  O.forEach((o,i)=>{const big=(i-1)/Math.max(1,N-2);
   evObj(i,i?T[i]+.6:0,{n:o.val,de:i?O[i-1].val:0,cs:i?T[i]+.62:.2,dur:.6,...(D.unite||{}),...(o.aff||{})});
   if(i){SONS.push({t:T[i],s:'whoosh',d:.45,fc:700,g:.3});
    if(v)SONS.push({t:T[i]+.6,s:'pieces',n:13,pas:.047,g:.2},{t:T[i]+1.2,s:'plop',big:big*.6,g:.45});
    else SONS.push({t:T[i]+.5,s:'plop',big:.1,g:.35},{t:T[i]+.58,s:'zip',d:.62,f:300+900*big,g:.55},{t:T[i]+1.2,s:'plop',big:.3+.5*big,g:.5},{t:T[i]+.62,s:'compteur',n:10,f:1000,pas:.055,g:.12});
    SONS.push({t:T[i]+1.3,s:'note',k:i,g:.26});}
   else SONS.push({t:.2,s:v?'pieces':'compteur',n:10,f:1000,pas:.055,g:.16},{t:.8,s:'note',k:0,g:.26});});
 },
 build(L){const v=this.v;let h=v?`<div class="clay" style="left:60px;top:1110px;width:960px;height:24px;border-radius:12px;background:#7a5230"></div>`
   :`<div class="clay" style="left:108px;top:520px;width:18px;height:560px;border-radius:9px;background:#fff6e3"></div>`;
  for(let i=0;i<N;i++){const c=O[i].couleur||'#ffb11f';
   h+=v?`<div class="stk clay" id="b${i}" style="display:none"><i></i></div>`
      :`<div class="bar clay" id="b${i}" style="display:none;background:${mix(c,'#ffffff',.4)}"></div><div id="pl${i}" style="display:none;width:124px;height:124px;filter:${filtreBoule(O[i],i)}">${svgObj(O[i],i)}</div>`;}
  L.innerHTML=h;this.b=O.map((_,i)=>document.getElementById('b'+i));this.pl=O.map((_,i)=>document.getElementById('pl'+i));},
 draw(t,bi,ev){
  const v=this.v,LEN=this.LEN;let k=0;for(let i=1;i<N;i++)if(t>=T[i])k=i;
  const u=t-T[k],q=k?eio(cl(u/.5)):1,s=k?llog(LEN/O[k-1].val,LEN/O[k].val,q):LEN/O[0].val;
  const lanes=v?[690,330,90]:[960,680,470];let tg=null;
  for(let i=0;i<N;i++){
   const b=this.b[i],p=this.pl[i],rel=k-i;
   if(rel<0||rel>2){b.style.display='none';if(p)p.style.display='none';continue;}
   const pos=rel==0?0:rel-1+q,a=lanes[Math.floor(pos)],c=lanes[Math.min(2,Math.floor(pos)+1)],lane=lerp(a,c,pos-Math.floor(pos)),op=pos<=1?1:Math.max(0,2-pos);
   let gl=1,dy=0,vis=1;
   if(rel==0&&k>0){gl=cl((u-.6)/.6);if(u<.2)vis=0;else if(u<.5){const d=(u-.2)/.3;dy=-(1-d*d)*1500;}}
   const len=Math.min(LEN,O[i].val*s)*eo(gl),jx=jit(bi,i*7+1,1.3),jy=jit(bi,i*7+2,1.3);
   b.style.display=vis?'block':'none';b.style.opacity=op;
   if(v){const hgt=Math.max(5,len);b.style.height=hgt+'px';const th=Math.max(4,Math.min(40,hgt*.6));b.firstChild.style.height=th+'px';b.firstChild.style.top=-th/2+'px';b.style.transform=`translate(${lane-120+jx}px,${1110-hgt+jy}px)`;if(rel==1)tg=[O[i].nom,lane,1150];}
   else{b.style.width=(len+26)+'px';b.style.transform=`translate(${120-26+jx}px,${lane-26+jy}px)`;
    const run=gl>0&&gl<1;p.style.display=vis?'block':'none';p.style.opacity=op;
    p.style.transform=`translate(${120+len-62+jx}px,${lane-62+dy+jy}px) rotate(${jit(bi,i*7+3,1)+len*.6}deg) scale(${run?1.3:1},${run?.82:1})`;
    if(rel==1)tg=[O[i].nom,120+len,lane-128];}
  }
  tag(tg&&k>0&&u>.5?tg[0]:'',tg?tg[1]:0,tg?tg[2]:0,bi,v?16:140);fleche(0);
 }
};
// ================= scène 3 : océan (descente) =================
SCENES.ocean={
 SP:1250,
 init(){O.forEach((o,i)=>{
   evObj(i,i?T[i]+.7:0,{n:o.prof,de:i?O[i-1].prof:0,pre:i?'− ':'',suf:' m',cs:i?T[i]+.05:0,dur:1.2,...(o.aff||{})});
   if(i)SONS.push({t:T[i],s:'whoosh',d:1.2,fc:420,g:.5},{t:T[i]+.05,s:'bulles',n:11,g:.22},{t:T[i]+1.2,s:'plop',big:.2+.6*i/N,g:.4},{t:T[i]+1.35,s:'note',k:i,g:.26});
   else SONS.push({t:.15,s:'bulles',n:6,g:.2},{t:.7,s:'note',k:0,g:.26});});},
 frac(t){return this.cam(t)/((N-1)*this.SP);},
 cam(t){let k=0;for(let i=1;i<N;i++)if(t>=T[i])k=i;return k?lerp((k-1)*this.SP,k*this.SP,eio(cl((t-T[k])/1.2))):0;},
 build(L){let h=`<div id="ciel" style="left:0;width:1080px;height:900px;background:#232a63"></div><div id="vague" class="clay" style="left:-20px;width:1120px;height:26px;border-radius:13px;background:#ffffff"></div><div id="fondm" class="clay" style="left:-20px;width:1120px;height:900px;border-radius:60px;background:#c9a86a"></div>`;
  for(let j=0;j<18;j++)h+=`<div class="tick"></div>`;
  for(let j=0;j<16;j++){const r=10+rnd(j,5)*26;h+=`<div class="bub" style="width:${r}px;height:${r}px"></div>`;}
  O.forEach((o,i)=>h+=`<div class="clay" id="f${i}" style="display:none;width:420px;height:252px"><svg viewBox="0 0 200 120" width="420" height="252">${FIG[o.fig](o.couleur||'#2b4a8c')}</svg></div>`);
  L.innerHTML=h;const g=id=>document.getElementById(id);this.f=O.map((_,i)=>g('f'+i));this.ciel=g('ciel');this.vague=g('vague');this.fondm=g('fondm');
  this.tk=[...L.querySelectorAll('.tick')];this.bu=[...L.querySelectorAll('.bub')];},
 draw(t,bi){
  const SP=this.SP,c=this.cam(t),CY=800;
  this.ciel.style.transform=`translate(0,${CY-330-900-c}px)`;this.vague.style.transform=`translate(${jit(bi,3,2)}px,${CY-340-c+jit(bi,4,2)}px)`;
  this.fondm.style.transform=`translate(0,${CY+(N-1)*SP+740-c}px)`;
  this.f.forEach((el,i)=>{const y=CY+i*SP-c;if(y<-300||y>2200){el.style.display='none';return;}
   el.style.display='block';el.style.transform=`translate(${(i==0?540:i%2?600:480)-210+jit(bi,i*7+1,1.5)}px,${y-126+8*Math.sin(bi*.5+i)+jit(bi,i*7+2,1.5)}px) rotate(${jit(bi,i*7+3,1.2)}deg)`;});
  this.tk.forEach((el,j)=>{const y=((j*130-c)%2340+2340)%2340-200;el.style.transform=`translate(24px,${y}px) scaleX(${j%4?1:1.7})`;el.style.transformOrigin='0 0';});
  this.bu.forEach((el,j)=>{const y=1960-((t*(90+rnd(j,6)*160)+rnd(j,7)*2200+c*.6)%2200);el.style.transform=`translate(${60+rnd(j,8)*940+18*Math.sin(t*2+j)}px,${y}px)`;});
  tag('');fleche(0);
 }
};

SCENES.probas={
 init(){O.forEach((o,i)=>{
   evObj(i,i?T[i]+.5:0,{n:o.n,de:i?O[i-1].n:1,pre:(o.env?'≈ ':'')+'1 SUR ',cs:i?T[i]+.1:0,dur:1.0});
   if(i)SONS.push({t:T[i],s:'whoosh',d:.6,fc:900,g:.4},{t:T[i]+.1,s:'compteur',n:19,f:900,pas:.05,g:.15},{t:T[i]+1.1,s:'plop',big:i/N,g:.5},{t:T[i]+1.25,s:'note',k:i,g:.26});
   else SONS.push({t:.3,s:'plop',big:.1,g:.4},{t:.6,s:'note',k:0,g:.26});});},
 build(L){const dots='radial-gradient(circle,#f3e2b3 0 37%,rgba(0,0,0,0) 40%)';
  L.innerHTML=`<div id="pf" class="clay"><div id="pa" style="position:absolute;left:0;top:0;background-image:${dots}"></div><div id="pb" style="position:absolute;left:0;background-image:${dots}"></div><div id="pa2" style="position:absolute;left:0;top:0;background:#cbb98a;border-radius:10px"></div><div id="pb2" style="position:absolute;left:0;background:#cbb98a"></div></div><div id="pr"></div>`;
  const g=id=>document.getElementById(id);this.e={pf:g('pf'),pa:g('pa'),pb:g('pb'),pa2:g('pa2'),pb2:g('pb2'),pr:g('pr')};},
 draw(t,bi){
  let k=0;for(let i=1;i<N;i++)if(t>=T[i])k=i;
  const W=760,n=Math.round(k?llog(O[k-1].n,O[k].n,eio(cl((t-T[k])/1.0))):O[0].n);
  const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),cell=W/cols,last=n-cols*(rows-1),H=rows*cell,left=160,top=800-H/2,e=this.e;

  e.pa.style.width=e.pa2.style.width=W+'px';e.pa.style.height=e.pa2.style.height=(rows-1)*cell+'px';e.pa.style.backgroundSize=bs;
  e.pb.style.top=e.pb2.style.top=(rows-1)*cell+'px';e.pb.style.width=e.pb2.style.width=last*cell+'px';e.pb.style.height=e.pb2.style.height=cell+'px';e.pb.style.backgroundSize=bs;
  e.pa.style.opacity=e.pb.style.opacity=od;e.pa2.style.opacity=e.pb2.style.opacity=1-od;
  const rc=Math.min(Math.floor(cols*.62),rows>1?cols-1:last-1),rr=Math.floor((rows-1)*.4),size=Math.max(cell*.76,20),x=left+(rc+.5)*cell,y=top+(rr+.5)*cell;
  e.pr.style.width=e.pr.style.height=size+'px';e.pr.style.transform=`translate(${x-size/2+jit(bi,5,1)}px,${y-size/2+jit(bi,6,1)}px)`;
  tag('');fleche(cell<60,x,y-size/2+4,t-(T[k]+.9),bi,0);
